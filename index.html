<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Allyy! ❤️</title>
    <style>
        :root {
            --primary-pink: #ff85a2;
            --secondary-pink: #f72585;
            --soft-bg: #ffe5ec;
        }

        body {
            background-color: var(--soft-bg);
            margin: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Floating background elements */
        .bg-heart {
            position: absolute;
            color: rgba(255, 133, 162, 0.3);
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 15s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 45px rgba(255, 105, 180, 0.2);
            text-align: center;
            max-width: 400px;
            width: 85%;
            z-index: 10;
            border: 2px solid #fff;
            transition: all 0.5s ease-in-out;
        }

        .cat-img {
            width: 100%;
            max-width: 240px;
            height: 240px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 20px;
            border: 5px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        h1 {
            color: var(--secondary-pink);
            font-size: 1.4rem;
            min-height: 70px;
            line-height: 1.3;
            transition: opacity 0.3s ease;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 80px;
            position: relative;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background-color: var(--primary-pink);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 133, 162, 0.4);
            z-index: 11;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: var(--secondary-pink);
        }

        #noBtn {
            background-color: #d1d8e0;
            color: #7f8c8d;
            position: absolute;
            z-index: 10;
            /* Smooth slide motion */
            transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Initial Overlay */
        #music-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #fff0f3 0%, #ffc1cf 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        .start-btn {
            background: white;
            color: var(--secondary-pink);
            padding: 18px 35px;
            border-radius: 50px;
            font-size: 1.4rem;
            cursor: pointer;
            border: 2px solid var(--primary-pink);
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.3);
        }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="music-overlay">
        <h2 style="color: #d63384; margin-bottom: 20px; animation: softPulse 2s infinite;">You have a message! 💌</h2>
        <button class="start-btn" onclick="startExperience()">Open for Ally ❤️</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <img id="cat-display" class="cat-img" src="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZnlreXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/MDJ9IbxxvDUQM/giphy.webp" alt="Cute Cat">
        <h1 id="main-text">Ally, will you be my Valentine? 🌹</h1>
        
        <div class="buttons" id="btn-group">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const mainText = document.getElementById('main-text');
        const catImg = document.getElementById('cat-display');
        const music = document.getElementById('bgMusic');

        const shuffleData = [
            { text: "Lahhh pakipot yarnnn??? 🥺", img: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZnlreXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/9Y5BbDSkSTiY8/giphy.webp" },
            { text: "Really? Di mo na naman ako love... 💔", img: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXAwbG14Z3Rwdm52ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/OPU6wUKARA3NTAD6T3/giphy.webp" },
            { text: "Ally please... sige no more Nagi oh...", img: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/7SF5scGB2AFrO/giphy.webp" },
            { text: "Sigee, d na tayo uuwi samin! 😭", img: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/26BRv0ThflsHCq_CQ/giphy.webp" },
            { text: "Is that a NO? My heart is breaking... 😿", img: "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZnlreXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/ICOgUNoMPvG24/giphy.webp" }
        ];

        function startExperience() {
            document.getElementById('music-overlay').classList.add('hidden');
            music.volume = 0.4;
            music.play();
            createBgHearts();
        }

        function createBgHearts() {
            for(let i=0; i<15; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 10 + 's';
                document.body.appendChild(heart);
            }
        }

        // Fleeing Logic (Now restricted to stay close-ish)
        noBtn.addEventListener('mouseover', () => {
            moveButton();
            shuffleContent();
        });

        function moveButton() {
            // Limits movement to a 150px box around the center
            const offset = 150;
            const x = (Math.random() - 0.5) * offset * 2;
            const y = (Math.random() - 0.5) * offset * 2;
            
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        function shuffleContent() {
            catImg.style.opacity = 0;
            mainText.style.opacity = 0;
            
            setTimeout(() => {
                const randomIdx = Math.floor(Math.random() * shuffleData.length);
                mainText.innerText = shuffleData[randomIdx].text;
                catImg.src = shuffleData[randomIdx].img;
                catImg.style.opacity = 1;
                mainText.style.opacity = 1;
            }, 300);
        }

        function celebrate() {
            noBtn.style.display = 'none';
            mainText.style.opacity = 0;
            catImg.style.transform = 'scale(0)';
            
            setTimeout(() => {
                mainText.innerHTML = "YAY! I KNEW YOU'D SAY YES! ❤️";
                mainText.style.opacity = 1;
                catImg.src = "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZnlreXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KztT2c4u8mYYUiMKdJ/giphy.webp";
                catImg.style.transform = 'scale(1)';
                document.getElementById('btn-group').innerHTML = "<h2 style='color: #ff69b4; animation: softPulse 1s infinite;'>See you on the 14th, Loveyyyy! 🐾</h2>";
            }, 500);

            for(let i=0; i<60; i++) {
                setTimeout(createBurstHeart, i * 80);
            }
        }

        function createBurstHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = ['❤️', '💖', '💝', '💕'][Math.floor(Math.random() * 4)];
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.zIndex = '1000';
            heart.style.transition = `transform ${2 + Math.random() * 2}s linear, opacity 2s`;
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.style.transform = `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
                heart.style.opacity = '0';
            }, 100);

            setTimeout(() => heart.remove(), 4000);
        }
    </script>
</body>
</html>
