<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ally ❤️</title>
    <style>
        :root {
            --primary-pink: #ff85a2;
            --secondary-pink: #f72585;
            --soft-white: #fff9fa;
        }

        body {
            background-color: #ffe5ec;
            margin: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Floating background hearts decoration */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 45px rgba(255, 105, 180, 0.2);
            text-align: center;
            max-width: 400px;
            width: 85%;
            z-index: 10;
            border: 2px solid #fff;
        }

        .cat-img {
            width: 100%;
            max-width: 240px;
            height: 240px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 20px;
            border: 5px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--secondary-pink);
            font-size: 1.4rem;
            min-height: 70px;
            line-height: 1.3;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 60px;
            margin-top: 10px;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s all;
        }

        #yesBtn {
            background-color: var(--primary-pink);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 133, 162, 0.4);
            animation: softPulse 2s infinite;
        }

        @keyframes softPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #noBtn {
            background-color: #d1d8e0;
            color: #7f8c8d;
            position: absolute;
            transition: all 0.15s ease-out;
            z-index: 100;
        }

        #music-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #fff0f3 0%, #ffc1cf 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .start-btn {
            background: white;
            color: var(--secondary-pink);
            padding: 18px 35px;
            border-radius: 50px;
            font-size: 1.4rem;
            cursor: pointer;
            border: 2px solid var(--primary-pink);
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.3);
            transition: 0.3s;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            background: var(--primary-pink);
            color: white;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="music-overlay">
        <h2 style="color: #d63384; margin-bottom: 20px;">You have 1 new message! 💌</h2>
        <button class="start-btn" onclick="startExperience()">Open it, Ally! ❤️</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <img id="cat-display" class="cat-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZnlreXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/MDJ9IbxxvDUQM/giphy.gif" alt="Cute Cat">
        <h1 id="main-text">Ally, will you be my Valentine? 🌹</h1>
        
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const mainText = document.getElementById('main-text');
        const catImg = document.getElementById('cat-display');
        const music = document.getElementById('bgMusic');

        const shuffleData = [
            { text: "Lahhh pakipot yarnnn??? 🥺", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZnlreXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/9Y5BbDSkSTiY8/giphy.gif" },
            { text: "Really? Di mo na naman ako love... 💔", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXAwbG14Z3Rwdm52ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/OPU6wUKARA3NTAD6T3/giphy.gif" },
            { text: "Ally please... sige no more Nagi oh...", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/7SF5scGB2AFrO/giphy.gif" },
            { text: "Sigee, d na tayo uuwi samin! 😭", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/26BRv0ThflsHCq_CQ/giphy.gif" },
            { text: "Is that a NO? My heart is breaking... 😿", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZnlreXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/ICOgUNoMPvG24/giphy.gif" },
            { text: "I'll be the best date ever, promise! ✨", img: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/C9x8gX02SnMIo/giphy.gif" }
        ];

        function startExperience() {
            document.getElementById('music-overlay').classList.add('hidden');
            music.volume = 0.5;
            music.play();
        }

        // Fleeing Logic
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const noRect = noBtn.getBoundingClientRect();
            const noCenterX = noRect.left + noRect.width / 2;
            const noCenterY = noRect.top + noRect.height / 2;

            const distance = Math.hypot(mouseX - noCenterX, mouseY - noCenterY);

            // Trigger flee and shuffle if cursor within 120px
            if (distance < 120) {
                moveButton();
                shuffleContent();
            }
        });

        function moveButton() {
            const padding = 50;
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding * 2) + padding;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding * 2) + padding;
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function shuffleContent() {
            const randomIdx = Math.floor(Math.random() * shuffleData.length);
            if (mainText.innerText !== shuffleData[randomIdx].text) {
                mainText.innerText = shuffleData[randomIdx].text;
                catImg.src = shuffleData[randomIdx].img;
            }
        }

        function celebrate() {
            const buttons = document.querySelector('.buttons');
            noBtn.style.display = 'none';

            mainText.innerHTML = "YAY! I KNEW YOU'D SAY YES! ❤️";
            catImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZnlreXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3eXp4ZzR3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KztT2c4u8mYYUiMKdJ/giphy.gif";
            buttons.innerHTML = "<h2 style='color: #ff69b4;'>See you on the 14th, Loveyyyy! 🐾</h2>";

            // Exploding heart effect
            for(let i=0; i<60; i++) {
                setTimeout(createHeart, i * 80);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = ['❤️', '💖', '💝', '💕'][Math.floor(Math.random() * 4)];
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.zIndex = '1000';
            heart.style.transition = `transform ${2 + Math.random() * 2}s linear, opacity 2s`;
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.style.transform = `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
                heart.style.opacity = '0';
            }, 100);

            setTimeout(() => heart.remove(), 4000);
        }
    </script>
</body>
</html>
